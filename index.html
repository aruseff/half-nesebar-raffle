<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1C4F">
<title>Полумаратон Несебър · Half Marathon Nesebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  :root {
    --court: #1B3FA0;
    --night: 10, 28, 79;            /* rgb of the scrims and panel */
    --sun: #00a6f4;
    --sun-press: #F2BE12;
    --chalk: #FFFFFF;
    --chalk-dim: rgba(255,255,255,.78);
    --line: rgba(255,255,255,.28);
    --field: rgba(255,255,255,.1);
    --error: #FFB4A8;
    --ink-on-sun: #13204A;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --night: 6, 18, 54; }
  }
  :root[data-theme="dark"] { --night: 6, 18, 54; }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: rgb(var(--night));
    color: var(--chalk);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .col { width: min(100%, 44rem); margin: 0 auto; padding: 0 1.25rem; }

  /* ---- Full-screen video ---- */
  .stage { position: fixed; inset: 0; z-index: 0; background: #000; }
  .stage video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .scrim { position: fixed; left: 0; right: 0; z-index: 1; pointer-events: none; }
  .scrim-top { top: 0; height: 32%; background: linear-gradient(rgba(var(--night), .85), rgba(var(--night), 0)); }
  .scrim-bottom { bottom: 0; height: 45%; background: linear-gradient(rgba(var(--night), 0), rgba(var(--night), .92) 60%); }

  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 2; padding-top: calc(var(--safe-top) + 4.75rem); pointer-events: none; }

  .lang {
    position: fixed; z-index: 5;
    top: calc(var(--safe-top) + 1rem); right: max(1.25rem, calc((100% - 44rem) / 2 + 1.25rem));
    display: flex; padding: .2rem; gap: .2rem;
    border: 1px solid var(--line); border-radius: 2rem;
    background: rgba(var(--night), .55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .lang button {
    border: 0; border-radius: 2rem; padding: .4rem .85rem;
    font: inherit; font-size: .9375rem; font-weight: 700;
    background: transparent; color: var(--chalk); cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--chalk); color: var(--ink-on-sun); }
  .event-name {
    margin: 0;
    font-stretch: 125%;
    font-weight: 850;
    font-size: clamp(2.1rem, 10vw, 3.75rem);
    line-height: .92;
    text-shadow: 0 2px 16px rgba(0,0,0,.35);
  }
  .logo {
    position: fixed; z-index: 5;
    top: calc(var(--safe-top) + .75rem); left: max(1.25rem, calc((100% - 44rem) / 2 + 1.25rem));
    width: auto; height: 3.25rem;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,.35));
    pointer-events: none;
  }
  .event-meta { margin: .55rem 0 0; font-weight: 600; color: var(--chalk-dim); }

  .play {
    position: fixed; inset: 0; margin: auto; z-index: 2;
    width: 5.5rem; height: 5.5rem; border-radius: 50%;
    border: 0; background: var(--sun); color: var(--ink-on-sun);
    font-size: 2rem; cursor: pointer;
    box-shadow: 0 .5rem 2rem rgba(0,0,0,.35);
  }
  .play[hidden] { display: none; }

  /* ---- Bottom dock: always visible ---- */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding-bottom: calc(var(--safe-bottom) + .9rem); }
  .sound {
    border: 1px solid var(--line); border-radius: 2rem;
    padding: .5rem .95rem;
    font: inherit; font-size: .9375rem; font-weight: 700;
    background: rgba(var(--night), .55); color: var(--chalk);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
  }
  .bonus { display: flex; gap: 1rem; justify-content: space-between; align-items: baseline; margin: .9rem 0 .5rem; color: #FFD23F; }
  .bonus strong { font-weight: 750; }
  .left { color: var(--chalk-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .track { height: .375rem; background: var(--line); border-radius: 1rem; overflow: hidden; margin-bottom: .9rem; }
  .track span { display: block; height: 100%; width: 0; background: var(--sun); transition: width .25s linear; }
  .register {
    display: block; text-align: center; text-decoration: none;
    background: var(--sun); color: var(--ink-on-sun);
    border-radius: .75rem; padding: 1.1rem 1rem;
    font-weight: 850; font-stretch: 112%; font-size: 1.25rem; line-height: 1.1;
    box-shadow: 0 .5rem 1.5rem rgba(0,0,0,.3);
  }
  .register:active { background: var(--sun-press); }

  /* ---- Draw panel: slides up when the video ends ---- */
  .draw {
    position: fixed; inset: 0; z-index: 3;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: rgba(var(--night), .94);
    padding: calc(var(--safe-top) + 5rem) 0 calc(var(--safe-bottom) + 7rem);
    transform: translateY(100%);
    visibility: hidden;
    transition: transform .5s cubic-bezier(.2,.8,.2,1), visibility 0s .5s;
  }
  body.drawn .draw { transform: none; visibility: visible; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  body.drawn .top, body.drawn .sound, body.drawn .bonus, body.drawn .track, body.drawn .play { display: none; }
  body.typing .dock { display: none; }

  .draw-name { margin: 0 0 1.5rem; font-stretch: 125%; font-weight: 850; font-size: 1.125rem; color: var(--sun); }
  .draw h2 { margin: 0; font-stretch: 115%; font-weight: 800; font-size: clamp(1.7rem, 7vw, 2.4rem); line-height: 1.05; }
  .draw-info { margin: .55rem 0 1.4rem; color: var(--chalk-dim); max-width: 34rem; }

  .field { margin-bottom: 1rem; }
  .field label { display: block; font-weight: 600; margin-bottom: .3rem; }
  .opt { font-weight: 400; color: var(--chalk-dim); }
  .field input {
    width: 100%; font: inherit; font-size: 1.0625rem; color: var(--chalk);
    background: var(--field);
    border: 2px solid var(--line); border-radius: .55rem;
    padding: .8rem .9rem;
  }
  .field input:focus { outline: none; border-color: var(--sun); }
  .consent { display: flex; gap: .7rem; align-items: flex-start; margin: 1.25rem 0; font-size: .9375rem; color: var(--chalk-dim); }
  .consent input { width: 1.35rem; height: 1.35rem; margin: .1rem 0 0; accent-color: var(--sun); flex: none; }
  .hp { position: absolute; left: -9999px; }
  .submit {
    width: 100%; border: 0; border-radius: .65rem;
    padding: 1rem; font: inherit; font-weight: 800; font-size: 1.125rem;
    background: var(--chalk); color: var(--ink-on-sun); cursor: pointer;
  }
  .submit:disabled { opacity: .6; cursor: progress; }
  .msg { min-height: 1.5rem; margin: .8rem 0 0; font-weight: 600; }
  .msg.err { color: var(--error); }
  .done h2 { color: var(--sun); }

  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .track span, .draw, body.drawn .draw { transition: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <video id="video" playsinline muted autoplay preload="auto"></video>
</div>
<div class="scrim scrim-top"></div>
<div class="scrim scrim-bottom"></div>

<img class="logo" data-logo src="logo-bg.png" width="900" height="584" alt="">

<div class="lang" role="group" aria-label="Език / Language">
  <button type="button" data-lang="bg" lang="bg">БГ</button>
  <button type="button" data-lang="en" lang="en">EN</button>
</div>

<header class="top">
  <div class="col">
    <h1 class="event-name" data-i18n="eventName"></h1>
    <p class="event-meta" data-i18n="eventMeta"></p>
  </div>
</header>

<button class="play" id="playBtn" type="button" data-i18n-aria="playVideo" hidden>▶</button>

<section class="draw" id="draw" aria-live="polite">
  <div class="col">
    <p class="draw-name" data-i18n="eventName"></p>
    <div id="formView">
      <h2 data-i18n="drawTitle"></h2>
      <p class="draw-info" data-i18n="drawInfo"></p>
      <form id="form" novalidate>
        <div class="field">
          <label for="name" data-i18n="labelName"></label>
          <input id="name" name="name" autocomplete="name" maxlength="100" required>
        </div>
        <div class="field">
          <label for="phone" data-i18n="labelPhone"></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" required>
        </div>
        <div class="field">
          <label for="email"><span data-i18n="labelEmail"></span> <span class="opt" data-i18n="optional"></span></label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="150">
        </div>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label class="consent">
          <input type="checkbox" id="consent" name="consent" value="yes">
          <span data-i18n="consent"></span>
        </label>
        <button class="submit" id="submitBtn" type="submit"></button>
        <p class="msg" id="msg" role="status"></p>
      </form>
    </div>
    <div class="done" id="doneView" hidden>
      <h2 data-i18n="doneTitle"></h2>
      <p class="draw-info" id="doneInfo"></p>
    </div>
  </div>
</section>

<div class="dock">
  <div class="col">
    <button class="sound" id="soundBtn" type="button"></button>
    <p class="bonus">
      <span><strong data-i18n="bonusStrong"></strong><span data-i18n="bonusRest"></span></span>
      <span class="left" id="timeLeft"></span>
    </p>
    <div class="track" aria-hidden="true"><span id="progress"></span></div>
    <a class="register" id="registerLink" href="#" target="_blank" rel="noopener" data-i18n="registerText"></a>
  </div>
</div>

<script src="config.js"></script>
<script src="lang/bg.js"></script>
<script src="lang/en.js"></script>
<script>
  const config = window.promoConfig;
  const strings = window.promoStrings;
  const byId = (id) => document.getElementById(id);
  const video = byId("video");
  const soundBtn = byId("soundBtn");
  const playBtn = byId("playBtn");
  const progress = byId("progress");
  const timeLeft = byId("timeLeft");
  const form = byId("form");
  const msg = byId("msg");
  const submitBtn = byId("submitBtn");
  byId("registerLink").href = config.registerUrl;

  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* ignore */ } }
  };

  // --- Language ---
  // Saved choice first; otherwise Bulgarian for Bulgarian phones, English for everyone else
  let lang = store.get("promoLang");
  if (!strings[lang]) lang = (navigator.language || "").toLowerCase().startsWith("bg") ? "bg" : "en";

  let sending = false;
  let msgKey = "";
  let duplicateEntry = false;
  let restSeconds = null;

  const t = (key) => strings[lang][key] ?? strings.en[key] ?? key;

  function render() {
    document.documentElement.lang = lang;
    document.title = t("eventName");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-logo]").forEach((el) => { el.src = "logo-" + lang + ".png"; });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    document.querySelectorAll(".lang button").forEach((b) => { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
    soundBtn.textContent = video.muted ? t("soundOn") : t("soundOff");
    submitBtn.textContent = sending ? t("sending") : t("submit");
    msg.textContent = msgKey ? t(msgKey) : "";
    byId("doneInfo").textContent = (duplicateEntry ? t("duplicate") + " " : "") + t("doneInfo");
    renderTimeLeft();
  }

  function renderTimeLeft() {
    if (restSeconds === null) return;
    const time = Math.floor(restSeconds / 60) + ":" + String(restSeconds % 60).padStart(2, "0");
    timeLeft.textContent = t("timeLeft").replace("{time}", time);
  }

  document.querySelectorAll(".lang button").forEach((b) => {
    b.addEventListener("click", () => {
      lang = b.dataset.lang;
      store.set("promoLang", lang);
      render();
    });
  });

  // --- Video ---
  if (config.videoPoster) video.poster = config.videoPoster;
  video.src = config.videoSrc;

  function tryPlay() {
    const attempt = video.play();
    if (attempt && attempt.catch) {
      attempt.then(() => { playBtn.hidden = true; })
             .catch(() => { playBtn.hidden = false; });
    }
  }

  playBtn.addEventListener("click", () => {
    video.muted = false;
    render();
    tryPlay();
  });

  soundBtn.addEventListener("click", () => {
    video.muted = !video.muted;
    render();
    if (video.paused) tryPlay();
  });

  video.addEventListener("click", () => { video.paused ? tryPlay() : video.pause(); });
  video.addEventListener("pause", () => { if (!video.ended) playBtn.hidden = false; });
  video.addEventListener("play", () => { playBtn.hidden = true; });

  // Block skipping forward: remember the furthest point actually watched
  let watchedUntil = 0;
  video.addEventListener("timeupdate", () => {
    if (!video.seeking && video.currentTime > watchedUntil && video.currentTime - watchedUntil < 2) {
      watchedUntil = video.currentTime;
    }
    if (video.duration) {
      progress.style.width = (watchedUntil / video.duration * 100) + "%";
      restSeconds = Math.max(0, Math.ceil(video.duration - watchedUntil));
      renderTimeLeft();
    }
  });
  video.addEventListener("seeking", () => {
    if (video.currentTime > watchedUntil + 1) video.currentTime = watchedUntil;
  });

  video.addEventListener("ended", openDraw);

  function openDraw() {
    if (store.get("promoEntered")) showDone();
    document.body.classList.add("drawn");
  }

  function showDone() {
    byId("formView").hidden = true;
    byId("doneView").hidden = false;
  }

  // For testing: open the page with ?reset to forget a previous draw entry
  if (new URLSearchParams(location.search).has("reset")) {
    try { localStorage.removeItem("promoEntered"); } catch (e) { /* ignore */ }
  }

  render();

  // Everyone watches the video every time; the form only opens when it ends
  tryPlay();

  // Hide the fixed dock while typing so the phone keyboard doesn't push it over the inputs
  form.addEventListener("focusin", (e) => { if (e.target.matches("input:not([type=checkbox])")) document.body.classList.add("typing"); });
  form.addEventListener("focusout", () => { document.body.classList.remove("typing"); });

  // --- Form ---
  function showError(key) {
    msgKey = key;
    msg.className = "msg err";
    render();
    msg.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const data = new FormData(form);
    const name = String(data.get("name") || "").trim();
    const phone = String(data.get("phone") || "").replace(/[^\d+]/g, "");
    const email = String(data.get("email") || "").trim();

    if (name.length < 2) return showError("errName");
    if (phone.replace(/\D/g, "").length < 8) return showError("errPhone");
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError("errEmail");
    if (!byId("consent").checked) return showError("errConsent");
    if (!/^https:\/\/script\.google\.com\//.test(config.sheetUrl)) return showError("errNotConnected");

    submitBtn.disabled = true;
    sending = true;
    msgKey = "";
    msg.className = "msg";
    render();

    const body = new URLSearchParams({
      name, phone, email,
      consent: "yes",
      website: String(data.get("website") || "")
    });

    try {
      const response = await fetch(config.sheetUrl, { method: "POST", body });
      const result = await response.json();
      if (result.ok) {
        store.set("promoEntered", "1");
        duplicateEntry = Boolean(result.duplicate);
        showDone();
      } else {
        showError("errInvalid");
      }
    } catch (e) {
      showError("errNetwork");
    } finally {
      submitBtn.disabled = false;
      sending = false;
      render();
    }
  });
</script>
</body>
</html>
